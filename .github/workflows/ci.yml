name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start test application
        shell: bash
        run: |
          npm run dev:web > /tmp/continuity-studio.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/api/studio > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/continuity-studio.log
          exit 1

      - name: Run API and provider tests
        run: npm test

      - name: Run browser test
        run: npm run test:ui

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
